<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f3f8f5; stroke: #204e3a; stroke-width: 2; }
    .box-alt { fill: #fff8ec; stroke: #b7791f; stroke-width: 2; }
    .box-ext { fill: #f4f1fb; stroke: #6b46c1; stroke-width: 2; stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #9aa39d; stroke-width: 1.5; stroke-dasharray: 3 5; }
    .t { fill: #1e1e1e; font-size: 15px; font-weight: 600; }
    .s { fill: #4a544d; font-size: 12.5px; }
    .z { fill: #6b756e; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
    .edge { fill: none; stroke: #204e3a; stroke-width: 2; stroke-linecap: round; }
    .edge-d { fill: none; stroke: #b7791f; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 7 5; }
    .edge-x { fill: none; stroke: #6b46c1; stroke-width: 2; stroke-linecap: round; }
    .lbl { fill: #204e3a; font-size: 12px; font-style: italic; }
    .lbl-d { fill: #9a6414; font-size: 12px; font-style: italic; }
    .lbl-x { fill: #6b46c1; font-size: 12px; font-style: italic; }
    .ah { fill: #204e3a; } .ah-d { fill: #b7791f; } .ah-x { fill: #6b46c1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1210; }
      .box { fill: #1a1f1c; stroke: #4e8a66; }
      .box-alt { fill: #231d12; stroke: #d69e2e; }
      .box-ext { fill: #1d1928; stroke: #9f7aea; }
      .zone { stroke: #3a423c; }
      .t { fill: #e8ede9; } .s { fill: #9aa39d; } .z { fill: #6b756e; }
      .edge { stroke: #6fbf8e; } .ah { fill: #6fbf8e; } .lbl { fill: #6fbf8e; }
      .edge-d { stroke: #d69e2e; } .ah-d { fill: #d69e2e; } .lbl-d { fill: #d69e2e; }
      .edge-x { stroke: #9f7aea; } .ah-x { fill: #9f7aea; } .lbl-x { fill: #b794f4; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-d" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-x" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="960" height="560" rx="16"/>

  <!-- zones -->
  <rect class="zone" x="24" y="40" width="392" height="496" rx="18"/>
  <text class="z" x="44" y="66">BROWSER · frontend/ (Next.js 16)</text>
  <rect class="zone" x="456" y="40" width="480" height="310" rx="18"/>
  <text class="z" x="476" y="66">SERVER · rentease-backend/ (Express)</text>
  <text class="z" x="484" y="536">THIRD-PARTY SERVICES</text>

  <!-- browser -->
  <rect class="box" x="52" y="88" width="336" height="76" rx="12"/>
  <text class="t" x="72" y="118">Pages (app/)</text>
  <text class="s" x="72" y="140">tenant: dashboard, bills, expenses, rent plan,</text>
  <text class="s" x="72" y="156">rewards, AI chat · landlord: properties, tenants…</text>

  <rect class="box" x="52" y="214" width="336" height="70" rx="12"/>
  <text class="t" x="72" y="243">lib/api.ts · lib/demoFetch.ts</text>
  <text class="s" x="72" y="265">one check per call: is this a demo account?</text>

  <rect class="box-alt" x="52" y="352" width="160" height="92" rx="12"/>
  <text class="t" x="68" y="380">lib/mockApi.ts</text>
  <text class="s" x="68" y="402">in-memory data from</text>
  <text class="s" x="68" y="418">mockData.ts, dates</text>
  <text class="s" x="68" y="434">shifted to "now"</text>

  <rect class="box" x="236" y="352" width="152" height="92" rx="12"/>
  <text class="t" x="252" y="380">fetch + JWT</text>
  <text class="s" x="252" y="402">Bearer token kept</text>
  <text class="s" x="252" y="418">in localStorage</text>

  <path class="edge" d="M220,164 L220,210" marker-end="url(#a)"/>
  <path class="edge-d" d="M170,284 C170,318 132,322 132,348" marker-end="url(#ad)"/>
  <text class="lbl-d" x="64" y="322">demo login</text>
  <path class="edge" d="M270,284 C270,318 312,322 312,348" marker-end="url(#a)"/>
  <text class="lbl" x="304" y="322">real account</text>
  <text class="s" x="62" y="480">Demo mode needs no server, so the frontend</text>
  <text class="s" x="62" y="498">deploys to Vercel as a fully static site.</text>

  <!-- server -->
  <rect class="box" x="484" y="88" width="210" height="96" rx="12"/>
  <text class="t" x="502" y="118">routes → controllers</text>
  <text class="s" x="502" y="140">/api/auth, bills, expenses,</text>
  <text class="s" x="502" y="156">budget, rent-plans, rewards,</text>
  <text class="s" x="502" y="172">shop, properties, ai</text>

  <rect class="box" x="718" y="88" width="190" height="96" rx="12"/>
  <text class="t" x="736" y="118">middleware/auth.js</text>
  <text class="s" x="736" y="140">verifies JWT, sets</text>
  <text class="s" x="736" y="156">req.user + role</text>

  <rect class="box" x="484" y="232" width="210" height="88" rx="12"/>
  <text class="t" x="502" y="262">Prisma ORM</text>
  <text class="s" x="502" y="284">prisma/schema.prisma</text>
  <text class="s" x="502" y="300">12 models, 4 migrations</text>

  <rect class="box" x="718" y="232" width="190" height="88" rx="12"/>
  <text class="t" x="736" y="262">SQLite</text>
  <text class="s" x="736" y="284">prisma/dev.db</text>
  <text class="s" x="736" y="300">(local file, gitignored)</text>

  <path class="edge" d="M388,398 C440,398 430,136 480,136" marker-end="url(#a)"/>
  <text class="lbl" x="426" y="244" text-anchor="end">REST</text><text class="lbl" x="426" y="260" text-anchor="end">JSON</text>
  <path class="edge" d="M694,136 L714,136" marker-end="url(#a)"/>
  <path class="edge" d="M590,184 L590,228" marker-end="url(#a)"/>
  <path class="edge" d="M694,276 L714,276" marker-end="url(#a)"/>

  <!-- external -->
  <rect class="box-ext" x="484" y="408" width="210" height="104" rx="12"/>
  <text class="t" x="502" y="438">Stripe Checkout</text>
  <text class="s" x="502" y="460">bill payments and rent-plan</text>
  <text class="s" x="502" y="476">deposits; webhook marks them</text>
  <text class="s" x="502" y="492">paid and awards points</text>

  <rect class="box-ext" x="718" y="408" width="190" height="104" rx="12"/>
  <text class="t" x="736" y="438">Google Gemini</text>
  <text class="s" x="736" y="460">AI chat + spending</text>
  <text class="s" x="736" y="476">analysis, prompted with</text>
  <text class="s" x="736" y="492">the tenant's own data</text>

  <path class="edge-x" d="M560,352 L560,404" marker-end="url(#ax)"/>
  <path class="edge-x" d="M620,404 L620,352" marker-end="url(#ax)"/>
  <text class="lbl-x" x="626" y="372">webhook</text>
  <text class="lbl-x" x="492" y="372">session</text>
  <path class="edge-x" d="M860,352 L860,404" marker-end="url(#ax)"/>
  <text class="lbl-x" x="866" y="372">prompt</text>
</svg>
